{% load static %}
<div class="mb-8 text-center">
  <div class="flex justify-center mb-6">
    <img src="{% static 'core/img/logos/isben-logo.png' %}" alt="ISBEN Solution" class="h-12 w-auto object-contain">
  </div>
  <h2 class="text-xl font-extrabold text-slate-800 dark:text-white sm:text-2xl">Bienvenido de nuevo</h2>
  <p class="mt-1 text-xs text-slate-500 dark:text-slate-400 sm:text-sm">Accede a tu cuenta</p>
</div>

{% if messages %}
<div class="mb-6 space-y-3">
  {% for message in messages %}
  <div x-data="{ show: true }" x-show="show" x-init="setTimeout(() => show = false, 5000)" x-transition
       class="flex items-start gap-3 rounded-2xl border px-4 py-3 shadow-sm
       {% if message.tags == 'success' %}border-emerald-200 bg-emerald-50 text-emerald-800 dark:border-emerald-900 dark:bg-emerald-950 dark:text-emerald-300
       {% elif message.tags == 'error' %}border-rose-200 bg-rose-50 text-rose-800 dark:border-rose-900 dark:bg-rose-950 dark:text-rose-300
       {% elif message.tags == 'warning' %}border-amber-200 bg-amber-50 text-amber-800 dark:border-amber-900 dark:bg-amber-950 dark:text-amber-300
       {% else %}border-brand-200 bg-brand-50 text-brand-800 dark:border-brand-800 dark:bg-slate-800 dark:text-brand-300{% endif %}">
    <i class="bi {% if message.tags == 'success' %}bi-check-circle-fill{% elif message.tags == 'error' %}bi-x-circle-fill{% elif message.tags == 'warning' %}bi-exclamation-triangle-fill{% else %}bi-info-circle-fill{% endif %} mt-0.5"></i>
    <p class="flex-1 text-sm font-medium">{{ message }}</p>
    <button @click="show=false" class="text-current opacity-60 hover:opacity-100"><i class="bi bi-x-lg"></i></button>
  </div>
  {% endfor %}
</div>
{% endif %}


<form method="post" class="space-y-4" x-data="{ verPassword: false }">
  {% csrf_token %}

  {% if form.non_field_errors %}
  <div
    class="rounded-lg border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700 dark:border-rose-900 dark:bg-rose-950 dark:text-rose-300">
    {{ form.non_field_errors.0 }}
  </div>
  {% endif %}

  <div class="space-y-1.5">
    <label for="id_username{{ sufijo }}" class="block text-xs font-semibold text-slate-700 dark:text-slate-300">Correo
      electrónico</label>
    <div class="relative">
      <input type="text" name="username" id="id_username{{ sufijo }}" value="{{ form.username.value|default:'' }}"
        required placeholder="usuario@empresa.com"
        class="w-full rounded-lg border border-slate-200 bg-white py-2.5 px-4 text-sm text-slate-700 placeholder:text-slate-400 transition focus:border-[#FB4318] focus:ring-1 focus:ring-[#FB4318] focus:outline-none dark:border-slate-700 dark:bg-slate-800 dark:text-white dark:placeholder:text-slate-500">
    </div>
  </div>

  <div class="space-y-1.5">
    <label for="id_password{{ sufijo }}"
      class="block text-xs font-semibold text-slate-700 dark:text-slate-300">Contraseña</label>
    <div class="relative">
      <input :type="verPassword ? 'text' : 'password'" name="password" id="id_password{{ sufijo }}" required
        placeholder="••••••••"
        class="w-full rounded-lg border border-slate-200 bg-white py-2.5 pl-4 pr-11 text-sm text-slate-700 placeholder:text-slate-400 transition focus:border-[#FB4318] focus:ring-1 focus:ring-[#FB4318] focus:outline-none dark:border-slate-700 dark:bg-slate-800 dark:text-white dark:placeholder:text-slate-500">

      <button type="button" @click="verPassword = !verPassword"
        class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:text-slate-500 dark:hover:text-slate-300">
        <i class="bi" :class="verPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
      </button>
    </div>
  </div>

  <div class="pt-2">
    <button type="submit"
      class="flex w-full items-center justify-center rounded-lg bg-[#F24E1E] px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition active:scale-[0.98] hover:bg-[#d84013]">
      Ingresar
    </button>
  </div>
</form>

<p class="mt-6 text-center text-xs font-medium text-slate-500 dark:text-slate-400">
  <a href="#" class="hover:text-[#F24E1E]">¿Olvidaste tu contraseña?</a>
</p>
<p class="mt-3 text-center text-xs font-medium text-slate-500 dark:text-slate-400">
  ¿No tienes cuenta? <a href="{% url 'registro' %}" class="font-bold text-[#F24E1E] hover:underline">Crear cuenta</a>
</p>
