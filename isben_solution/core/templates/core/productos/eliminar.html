{% extends "master.html" %}
{% block title %}Eliminar producto{% endblock %}


{% block content %}
<div class="mb-6 flex flex-col justify-between sm:flex-row sm:items-center">
  <div>
    <h1 class="text-lg font-bold text-slate-800 lg:text-xl">Eliminar producto</h1>
  </div>
</div>

<div class="mx-auto max-w-lg rounded-2xl border border-rose-100 bg-white p-8 text-center shadow-sm">
  <div class="mx-auto mb-4 grid h-16 w-16 place-items-center rounded-full bg-rose-50 text-3xl text-rose-500"><i class="bi bi-exclamation-triangle"></i></div>
  <h2 class="text-lg font-bold text-slate-800">¿Eliminar este producto?</h2>
  <p class="mt-2 text-sm text-slate-500">Se eliminará <strong>{{ producto.nombre }}</strong> y su inventario asociado. Esta acción no se puede deshacer.</p>
  <form method="post" class="mt-6 flex justify-center gap-3">
    {% csrf_token %}
    <a href="{% url 'detalle_producto' producto.pk %}" class="rounded-xl border border-slate-200 px-5 py-2.5 text-sm font-semibold text-slate-500 transition hover:border-slate-300 hover:bg-slate-50">Cancelar</a>
    <button type="submit" class="rounded-xl bg-rose-600 px-6 py-2.5 text-sm font-semibold text-white shadow-soft transition active:scale-[0.98] hover:bg-rose-700"><i class="bi bi-trash3"></i> Sí, eliminar</button>
  </form>
</div>

{% endblock %}
