{% if messages %}
<div class="mb-6 space-y-3">
  {% for message in messages %}
  <div x-data="{ show: true }" x-show="show" x-init="setTimeout(() => show = false, 5000)" x-transition
       class="flex items-start gap-3 rounded-2xl border px-4 py-3 shadow-sm
       {% if message.tags == 'success' %}border-emerald-200 bg-emerald-50 text-emerald-800
       {% elif message.tags == 'error' %}border-rose-200 bg-rose-50 text-rose-800
       {% elif message.tags == 'warning' %}border-amber-200 bg-amber-50 text-amber-800
       {% else %}border-brand-200 bg-brand-50 text-brand-800{% endif %}">
    <i class="bi {% if message.tags == 'success' %}bi-check-circle-fill{% elif message.tags == 'error' %}bi-x-circle-fill{% elif message.tags == 'warning' %}bi-exclamation-triangle-fill{% else %}bi-info-circle-fill{% endif %} mt-0.5"></i>
    <p class="flex-1 text-sm font-medium">{{ message }}</p>
    <button @click="show=false" class="text-current opacity-60 hover:opacity-100"><i class="bi bi-x-lg"></i></button>
  </div>
  {% endfor %}
</div>
{% endif %}
