{% url url_name as nav_url %}
<a href="{{ nav_url }}"
   class="group relative flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium transition {% if request.resolver_match.url_name == url_name %}bg-white/10 text-white shadow-soft{% else %}text-indigo-200 hover:translate-x-0.5 hover:bg-white/5 hover:text-white{% endif %}">
  {% if request.resolver_match.url_name == url_name %}
  <span class="absolute -left-1 top-1/2 h-5 w-1 -translate-y-1/2 rounded-full bg-white"></span>
  {% endif %}
  <i class="bi {{ icon }} text-lg"></i> {{ label }}
</a>
