{# Encabezado estándar de listado: título, buscador opcional y botón de acción #}
<div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
  <div>
    <h2 class="text-2xl font-bold text-slate-800">{{ titulo }}</h2>
    {% if subtitulo %}<p class="text-sm text-slate-400">{{ subtitulo }}</p>{% endif %}
  </div>
  <div class="flex items-center gap-3">
    {% if buscador %}
    <form method="get" class="relative">
      <i class="bi bi-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
      <input type="text" name="q" value="{{ request.GET.q }}" placeholder="Buscar..."
             class="w-48 rounded-xl border border-slate-200 bg-white py-2 pl-9 pr-3 text-sm shadow-sm focus:border-brand-500 focus:ring-4 focus:ring-brand-100 focus:outline-none sm:w-64">
    </form>
    {% endif %}
    {% if url_crear %}
    <a href="{{ url_crear }}"
       class="flex items-center gap-2 rounded-xl bg-gradient-to-r from-brand-600 to-brand-500 px-4 py-2.5 text-sm font-semibold text-white shadow-soft transition hover:from-brand-700 hover:to-brand-600">
      <i class="bi bi-plus-lg"></i> {{ texto_boton|default:"Nuevo" }}
    </a>
    {% endif %}
  </div>
</div>
