{% if page_obj.paginator.num_pages > 1 %}
<div class="mt-4 flex flex-col items-center justify-between gap-3 text-sm text-slate-500 sm:flex-row">
  <p>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }} &middot; {{ page_obj.paginator.count }} registros</p>
  <div class="flex gap-2">
    {% if page_obj.has_previous %}
      <a href="?page={{ page_obj.previous_page_number }}{% if request.GET.q %}&q={{ request.GET.q }}{% endif %}"
         class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 font-medium hover:bg-slate-50"><i class="bi bi-chevron-left"></i> Anterior</a>
    {% endif %}
    {% if page_obj.has_next %}
      <a href="?page={{ page_obj.next_page_number }}{% if request.GET.q %}&q={{ request.GET.q }}{% endif %}"
         class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 font-medium hover:bg-slate-50">Siguiente <i class="bi bi-chevron-right"></i></a>
    {% endif %}
  </div>
</div>
{% endif %}
