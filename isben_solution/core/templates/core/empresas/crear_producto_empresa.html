<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Asignar Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 700px;">
        <div class="card shadow">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">Añadir Producto para: {{ empresa.razon_social }}</h4>
                <small class="text-muted">RUC: {{ empresa.ruc }}</small>
            </div>
            <div class="card-body p-4">
                <form method="POST" novalidate>
                    {% csrf_token %}
                    
                    {{ formulario.empresa }}

                    {% for campo in formulario %}
                        {% if campo.name != 'empresa' %}
                            <div class="mb-3">
                                <label class="form-label fw-bold">{{ campo.label }}</label>
                                {{ campo }}
                                {% if campo.errors %}
                                    <div class="text-danger small mt-1">
                                        {{ campo.errors|striptags }}
                                    </div>
                                {% endif %}
                            </div>
                        {% endif %}
                    {% endfor %}

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <a href="{% url 'lista_empresas' %}" class="btn btn-secondary me-md-2">Volver</a>
                        <button type="submit" class="btn btn-primary">Registrar e Inyectar Producto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
